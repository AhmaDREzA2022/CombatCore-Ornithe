# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Loom/Ploceus 1.18 needs Java 25 to run (compilation itself uses the JDK 21
# toolchain declared in build.gradle, the installed JDK 25 is a JRE only).
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk-amd64

# Fabric Properties
# check these on https://ornithemc.net/develop
minecraft_version=1.8.9
loader_version=0.16.14
# Feather "gen2" mappings (ploceus 1.18 only resolves the feather-gen2 artifact for 1.8.9)
feather_build=2

# Mod Properties
mod_version=1.0.0
maven_group=com.combatcore
archives_base_name=combatcore
